name: Offline research checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Rebuild and check parcel probe
        run: make check
      - name: Validate retained research experiments
        run: make research-check
