name: Offline research checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validation dependencies
        run: python -m pip install -e ".[dev]"
      - name: Rebuild and check parcel probe
        run: make check
      - name: Exercise offline first-run workflow
        run: python scripts/first_run.py --out "$RUNNER_TEMP/housing-first-run"
      - name: Validate retained research experiments
        run: make research-check
      - name: Verify checks did not alter the checkout
        run: git diff --exit-code

  macos-walkthrough:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the editable checkout
        run: python -m pip install -e .
      - name: Check onboarding links
        run: python scripts/check_onboarding.py
      - name: Exercise offline walkthrough without optional dependencies
        run: python scripts/first_run.py --out runs/macos-first-run
